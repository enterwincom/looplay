<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
<title>Looplay - YouTube AB Loop</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f6f8;color:#222}
body{overflow-x:hidden}
header{background:#fff;border-top:4px solid #333;border-bottom:1px solid #ddd;padding:14px 20px}
.brand{font-size:24px;font-weight:700}.sub{font-size:13px;color:#777;margin-top:4px}
.container{width:100%;max-width:1050px;margin:0 auto;padding:20px}
.inputbox{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{min-width:0;flex:1;padding:13px;border:1px solid #bbb;border-radius:7px;font-size:15px}
button{border:1px solid #aaa;background:#fff;border-radius:7px;padding:10px 13px;cursor:pointer;font-size:14px;min-height:42px}
button:hover{background:#eee}
.primary{background:#333;color:#fff;border-color:#333}
.danger{background:#d9534f;color:#fff;border-color:#d43f3a}
.danger:hover{background:#c9302c}
.player{background:#111;border-radius:8px;overflow:hidden;width:100%}
#player{width:100%;aspect-ratio:16/9}
.controls,.saved{background:#fff;margin-top:14px;padding:16px;border-radius:8px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.label{font-weight:700;min-width:65px}
.time{font-variant-numeric:tabular-nums;background:#f0f1f3;padding:9px 10px;border-radius:5px;min-width:54px;text-align:center}
.speed{display:flex;flex-wrap:wrap;gap:6px}
.speed button.active{background:#333;color:#fff}
.note{width:100%;min-height:60px;padding:10px;border:1px solid #ccc;border-radius:6px;resize:vertical;font-size:14px}
.help{font-size:13px;color:#666;line-height:1.7}

/* 멀티 구간 아이템 스타일 */
.savedItem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;margin-bottom:8px;border:1px solid #eee;border-radius:6px;background:#fafafa}
.savedItem.active{border-color:#333;background:#f0f4ff}
.savedItem-info{min-width:0;overflow-wrap:anywhere}
.savedItem-title{font-weight:bold;margin-bottom:4px;color:#111}
.savedItem-time{font-size:13px;color:#555}
.savedItem-note{font-size:13px;color:#777;margin-top:4px}
.savedItem-actions{display:flex;gap:5px;flex-shrink:0}

@media(max-width:700px){
  header{padding:13px 14px}
  .brand{font-size:21px}.sub{font-size:12px}
  .container{padding:12px 10px}
  .inputbox{gap:6px}
  input[type=text]{font-size:14px;padding:12px}
  .inputbox button{padding:10px 11px;white-space:nowrap}
  .player{border-radius:5px}
  .controls,.saved{padding:12px;margin-top:10px;border-radius:6px}
  .row{gap:6px;margin:8px 0}
  .label{width:100%;min-width:100%;font-size:13px;margin-bottom:1px}
  button{flex:1;min-width:75px;padding:9px 8px;font-size:13px}
  .time{flex:0 0 auto}
  .speed{width:100%}.speed button{min-width:0}
  .note{font-size:14px}
  .savedItem{align-items:flex-start;flex-direction:column}
  .savedItem-actions{width:100%}
  .savedItem-actions button{flex:1}
}
@media(max-width:420px){
  .inputbox{flex-direction:column}
  .inputbox button{width:100%}
  button{min-height:40px}
  .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .row .label{grid-column:1/-1}
  .row .time{justify-self:start}
  .row .note{grid-column:1/-1}
  .row .speed{grid-column:1/-1}
  .speed{display:grid;grid-template-columns:repeat(3,1fr)}
  .speed button{width:100%}
  .savedItem-actions{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header style="background:#fff; border-top:4px solid #333; border-bottom:1px solid #ddd; padding:14px 20px; text-align:center;">
  <div class="brand">↻ Looplay</div>
  <div class="sub">YouTube 영상을 원하는 구간으로 반복 연습하세요</div>
</header>

<main class="container">
  <div class="inputbox">
    <input id="url" type="text" placeholder="YouTube 영상 URL을 붙여넣으세요">
    <button class="primary" onclick="loadVideo()">영상 불러오기</button>
  </div>

  <div class="player"><div id="player"></div></div>

  <section class="controls">
    <div class="row">
      <span class="label">구간 설정</span>
      <button onclick="setA()">A 설정</button>
      <span id="aTime" class="time">0:00</span>
      <button onclick="setB()">B 설정</button>
      <span id="bTime" class="time">0:00</span>
      <button id="loopBtn" class="primary" onclick="toggleLoop()">AB 반복</button>
      <button onclick="clearLoop()">반복 해제</button>
    </div>

    <div class="row">
      <span class="label">재생 제어</span>
      <button onclick="playVideo()">▶ 재생</button>
      <button onclick="pauseVideo()">Ⅱ 일시정지</button>
      <button onclick="restartA()">A부터</button>
      <button onclick="restartVideo()">처음부터</button>
    </div>

    <div class="row">
      <span class="label">재생 속도</span>
      <div class="speed">
        <button onclick="setSpeed(.5)">0.5x</button>
        <button onclick="setSpeed(.75)">0.75x</button>
        <button class="active" onclick="setSpeed(1)">1x</button>
        <button onclick="setSpeed(1.25)">1.25x</button>
        <button onclick="setSpeed(1.5)">1.5x</button>
        <button onclick="setSpeed(2)">2x</button>
      </div>
    </div>

    <div class="row">
      <span class="label">미세 이동</span>
      <button onclick="seek(-5)">-5초</button>
      <button onclick="seek(-1)">-1초</button>
      <button onclick="seek(.5)">+0.5초</button>
      <button onclick="seek(1)">+1초</button>
      <button onclick="seek(5)">+5초</button>
    </div>

    <div class="row">
      <span class="label">구간 저장</span>
      <input id="loopName" type="text" placeholder="구간 이름 (예: Intro, 코러스)" style="margin-bottom: 5px;">
      <textarea id="note" class="note" placeholder="연습 메모 (선택사항)"></textarea>
      <button class="primary" onclick="addLoop()" style="width:100%; margin-top:5px;">현재 A-B 구간 저장하기</button>
    </div>
  </section>

  <!-- 저장된 멀티 구간 목록 -->
  <section class="saved">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <strong>저장된 멀티 구간 목록</strong>
      <button class="danger" onclick="clearSaved()" style="min-height:30px; padding:4px 10px; font-size:12px;">전체 삭제</button>
    </div>
    <div id="savedList" class="help">저장된 구간이 없습니다. A/B 설정 후 저장해보세요.</div>
  </section>

  <section class="saved">
    <strong>키보드 단축키</strong>
    <table class="shortcut-table">
  <thead>
    <tr>
      <th>기능</th>
      <th>단축키</th>
      <th>기능</th>
      <th>단축키</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>AB 반복 시작/해제</td>
      <td><kbd>Ctrl</kbd> + <kbd>L</kbd></td>
      <td>재생 / 일시정지</td>
      <td><kbd>Ctrl</kbd> + <kbd>P</kbd></td>
    </tr>
    <tr>
      <td>A 지점 설정</td>
      <td><kbd>Ctrl</kbd> + <kbd>B</kbd></td>
      <td>B 지점 설정</td>
      <td><kbd>Shift</kbd> + <kbd>B</kbd></td>
    </tr>
    <tr>
      <td>5초 뒤로 / 앞으로</td>
      <td><kbd>J</kbd> / <kbd>L</kbd></td>
      <td>재생속도 조절</td>
      <td><kbd>↑</kbd> / <kbd>↓</kbd></td>
    </tr>
  </tbody>
</table>
  </section>
</main>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let player;
let videoId = "";
let A = 0;
let B = null;
let looping = false;
let timer = null;
let currentLoopId = null;

function extractId(url){
  try{
    const u = new URL(url);
    if(u.hostname.includes("youtu.be")) return u.pathname.substring(1).split("/")[0];
    if(u.hostname.includes("youtube.com")){
      if(u.searchParams.get("v")) return u.searchParams.get("v");
      const parts=u.pathname.split("/");
      const i=parts.indexOf("embed");
      if(i>=0) return parts[i+1];
      const s=parts.indexOf("shorts");
      if(s>=0) return parts[s+1];
    }
  }catch(e){}
  const m=url.match(/[?&]v=([^&]+)/);
  return m ? m[1] : null;
}

function onYouTubeIframeAPIReady(){
  // URL 파라미터 체크 (공유 링크로 접속했을 때 자동 로드)
  const params = new URLSearchParams(window.location.search);
  const paramV = params.get('v');
  const paramA = parseFloat(params.get('a'));
  const paramB = parseFloat(params.get('b'));

  const initialVideoId = paramV || "";

  player=new YT.Player("player",{
    videoId: initialVideoId,
    playerVars:{rel:0,playsinline:1},
    events:{
      onReady: (e) => {
        if(paramV){
          videoId = paramV;
          document.getElementById("url").value = "https://www.youtube.com/watch?v=" + paramV;
          if(!isNaN(paramA)) A = paramA;
          if(!isNaN(paramB)) B = paramB;
          updateTimes();
          if(B !== null){
            looping = true;
            player.seekTo(A, true);
            player.playVideo();
            startMonitor();
          }
        }
      },
      onStateChange: onStateChange
    }
  });
}

function loadVideo(){
  const id=extractId(document.getElementById("url").value.trim());
  if(!id){alert("올바른 YouTube URL을 입력하세요.");return;}
  videoId=id; A=0; B=null; looping=false; currentLoopId=null;
  updateTimes();
  player.loadVideoById(id);
  renderSaved();
}

function onStateChange(e){
  if(e.data===YT.PlayerState.PLAYING) startMonitor();
  else stopMonitor();
}

function startMonitor(){
  stopMonitor();
  timer=setInterval(()=>{
    if(!player || !looping || B===null) return;
    const t=player.getCurrentTime();
    if(t>=B) player.seekTo(A,true);
  },100);
}
function stopMonitor(){if(timer){clearInterval(timer);timer=null}}

function setA(){if(!player)return; A=player.getCurrentTime(); if(B!==null && A>=B)B=null; updateTimes();}
function setB(){if(!player)return; B=player.getCurrentTime(); if(B<=A){alert("B 지점은 A 지점보다 뒤에 있어야 합니다.");B=null;} updateTimes();}
function toggleLoop(){
  if(B===null){alert("먼저 A와 B 지점을 설정하세요.");return;}
  looping=!looping;
  if(looping) startMonitor(); else stopMonitor();
  updateLoopBtnUI();
}
function clearLoop(){looping=false;B=null;currentLoopId=null;stopMonitor();updateTimes();renderSaved();}
function restartA(){if(player)player.seekTo(A,true);player.playVideo();}
function restartVideo(){if(player){player.seekTo(0,true);player.playVideo();}}
function playVideo(){if(player)player.playVideo()}
function pauseVideo(){if(player)player.pauseVideo()}
function seek(sec){if(player)player.seekTo(Math.max(0,player.getCurrentTime()+sec),true)}
function setSpeed(s){
  if(player) player.setPlaybackRate(s);
  document.querySelectorAll(".speed button").forEach(b=>b.classList.remove("active"));
  const buttons=document.querySelectorAll(".speed button");
  buttons.forEach(b=>{if(b.textContent.trim()===s+"x")b.classList.add("active")});
}
function updateTimes(){
  document.getElementById("aTime").textContent=format(A);
  document.getElementById("bTime").textContent=B===null?"--:--":format(B);
  updateLoopBtnUI();
}
function updateLoopBtnUI(){
  const btn = document.getElementById("loopBtn");
  if(looping){
    btn.textContent = "반복 중지";
    btn.classList.remove("primary");
  } else {
    btn.textContent = "AB 반복";
    btn.classList.add("primary");
  }
}
function format(sec){
  sec=Math.floor(sec||0);let m=Math.floor(sec/60),s=sec%60;
  return m+":"+String(s).padStart(2,"0");
}

/* --- 멀티 구간 저장 및 불러오기 --- */
function addLoop(){
  if(!videoId){alert("먼저 영상을 불러오세요.");return;}
  if(B===null){alert("A와 B 구간을 먼저 설정해주세요.");return;}

  const title = document.getElementById("loopName").value.trim() || `구간 (${format(A)} ~ ${format(B)})`;
  const note = document.getElementById("note").value.trim();

  const item = {
    id: Date.now(),
    videoId,
    title,
    A,
    B,
    note,
    createdAt: new Date().toLocaleString()
  };

  const list = JSON.parse(localStorage.getItem("myMultiLoops")||"[]");
  list.unshift(item);
  localStorage.setItem("myMultiLoops", JSON.stringify(list));

  // 입력 필드 초기화 및 목록 갱신
  document.getElementById("loopName").value = "";
  document.getElementById("note").value = "";
  renderSaved();
}

function renderSaved(){
  const list = JSON.parse(localStorage.getItem("myMultiLoops")||"[]");
  const box = document.getElementById("savedList");
  
  if(!list.length){
    box.innerHTML = "저장된 구간이 없습니다. A/B 설정 후 저장해보세요.";
    return;
  }

  box.innerHTML = list.map((x) => {
    const isCurrent = currentLoopId === x.id;
    return `
      <div class="savedItem ${isCurrent ? 'active' : ''}">
        <div class="savedItem-info">
          <div class="savedItem-title">${escapeHtml(x.title)}</div>
          <div class="savedItem-time">⏱ ${format(x.A)} ~ ${format(x.B)} (ID: ${x.videoId})</div>
          ${x.note ? `<div class="savedItem-note">📝 ${escapeHtml(x.note)}</div>` : ''}
        </div>
        <div class="savedItem-actions">
          <button class="primary" onclick="playSavedLoop(${x.id})">재생</button>
          <button onclick="copyLoopShareLink(${x.id})">공유 링크</button>
          <button onclick="copyEmbedCode(${x.id})">iframe 복사</button>
          <button class="danger" onclick="deleteLoopItem(${x.id})">삭제</button>
        </div>
      </div>
    `;
  }).join("");
}

function playSavedLoop(id){
  const list = JSON.parse(localStorage.getItem("myMultiLoops")||"[]");
  const target = list.find(x => x.id === id);
  if(!target) return;

  currentLoopId = target.id;
  A = target.A;
  B = target.B;

  if(videoId !== target.videoId){
    videoId = target.videoId;
    document.getElementById("url").value = "https://www.youtube.com/watch?v=" + videoId;
    player.loadVideoById(videoId);
  }

  updateTimes();
  looping = true;
  player.seekTo(A, true);
  player.playVideo();
  startMonitor();
  renderSaved();
}

function deleteLoopItem(id){
  let list = JSON.parse(localStorage.getItem("myMultiLoops")||"[]");
  list = list.filter(x => x.id !== id);
  localStorage.setItem("myMultiLoops", JSON.stringify(list));
  if(currentLoopId === id) currentLoopId = null;
  renderSaved();
}

function clearSaved(){
  if(confirm("저장된 모든 구간을 삭제하시겠습니까?")){
    localStorage.removeItem("myMultiLoops");
    currentLoopId = null;
    renderSaved();
  }
}

/* --- 코드/링크 복사 기능 --- */
function copyLoopShareLink(id){
  const list = JSON.parse(localStorage.getItem("myMultiLoops")||"[]");
  const target = list.find(x => x.id === id);
  if(!target) return;

  const baseUrl = window.location.origin + window.location.pathname;
  const shareUrl = `${baseUrl}?v=${target.videoId}&a=${target.A.toFixed(1)}&b=${target.B.toFixed(1)}`;

  navigator.clipboard.writeText(shareUrl).then(() => {
    alert("구간 반복 플레이어 공유 링크가 복사되었습니다!\n\n" + shareUrl);
  }).catch(() => {
    prompt("아래 링크를 복사하세요:", shareUrl);
  });
}

function copyEmbedCode(id){
  const list = JSON.parse(localStorage.getItem("myMultiLoops")||"[]");
  const target = list.find(x => x.id === id);
  if(!target) return;

  const startSec = Math.floor(target.A);
  const endSec = Math.ceil(target.B);
  const embedCode = `<iframe width="560" height="315" src="https://www.youtube.com/embed/${target.videoId}?start=${startSec}&end=${endSec}&loop=1&playlist=${target.videoId}" frameborder="0" allowfullscreen></iframe>`;

  navigator.clipboard.writeText(embedCode).then(() => {
    alert("YouTube 공식 퍼가기(iframe) 코드가 복사되었습니다!");
  }).catch(() => {
    prompt("아래 iframe 코드를 복사하세요:", embedCode);
  });
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

// 키보드 이벤트
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  if(e.ctrlKey && e.key.toLowerCase()==="l"){e.preventDefault();toggleLoop()}
  else if(e.ctrlKey && e.key.toLowerCase()==="p"){e.preventDefault();player.getPlayerState()===1?pauseVideo():playVideo()}
  else if(e.ctrlKey && e.key.toLowerCase()==="b"){e.preventDefault();setA()}
  else if(e.shiftKey && e.key.toLowerCase()==="b"){e.preventDefault();setB()}
  else if(e.key.toLowerCase()==="j")seek(-5);
  else if(e.key.toLowerCase()==="l")seek(5);
  else if(e.key==="ArrowUp")setSpeed(Math.min(2,(player.getPlaybackRate()||1)+.25));
  else if(e.key==="ArrowDown")setSpeed(Math.max(.25,(player.getPlaybackRate()||1)-.25));
});

renderSaved();
</script>
</body>
</html>
